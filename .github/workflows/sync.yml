name: slack-status-sync

on:
  schedule:
    # GitHub cron is UTC. KST = UTC+9 (no DST). Every 5 min so "회의 중"
    # tracks meeting boundaries closely. This repo is public → unlimited
    # Actions minutes, so frequency is free.
    # ~07:00–09:00 KST on Mon–Fri  -> 22:00–23:59 UTC Sun–Thu
    - cron: '*/5 22-23 * * 0-4'
    # ~09:00–18:55 KST on Mon–Fri  -> 00:00–09:55 UTC Mon–Fri
    - cron: '*/5 0-9 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — log intended changes, touch nothing'
        type: boolean
        default: false

concurrency:
  group: slack-status-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/sync.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_CALENDAR_MAILBOX: ${{ secrets.MS_CALENDAR_MAILBOX }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-run
          path: last-run.json
          if-no-files-found: ignore
