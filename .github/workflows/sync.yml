name: slack-status-sync (leave feed)

on:
  schedule:
    # Leave feed only: reads the hr@ calendar, writes each connected person's
    # day-level status (재택/연차/반차/외근) to KV as `day`. It does NOT touch
    # Slack — the Cloudflare Worker cron reads `day`, overlays "회의 중", and
    # does all the Slack writes. Leave rarely changes, so every 15 min is plenty,
    # and GitHub's flaky scheduler no longer matters for meeting latency.
    # GitHub cron is UTC. KST = UTC+9 (no DST).
    # ~07:00–09:00 KST Mon–Fri  -> 22:00–23:59 UTC Sun–Thu
    - cron: '*/15 22-23 * * 0-4'
    # ~09:00–19:00 KST Mon–Fri  -> 00:00–10:00 UTC Mon–Fri
    - cron: '*/15 0-10 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — log intended changes, write nothing to KV'
        type: boolean
        default: false

concurrency:
  group: slack-status-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/sync.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_CALENDAR_MAILBOX: ${{ secrets.MS_CALENDAR_MAILBOX }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-run
          path: last-run.json
          if-no-files-found: ignore
